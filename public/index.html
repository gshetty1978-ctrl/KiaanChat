<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KiaanChat</title>
<meta name="description" content="Chat directly with Kiaan about a website you want built.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6e62'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='30' font-weight='600' fill='%23f6f5f1' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e6e9ef;
    --muted:#96a0b5; --accent:#2f6e62; --accent2:#4fb6a3; --bubble-me:#2f6e62; --bubble-them:#1f2430;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    padding:16px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
  }
  .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:Georgia,serif;flex-shrink:0}
  header h1{font-size:1rem;margin:0}
  header p{font-size:0.8rem;color:var(--muted);margin:0}

  #gate{
    flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .gate-card{max-width:340px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
  .gate-card h2{margin:0;font-size:1.3rem}
  .gate-card p{margin:0;color:var(--muted);font-size:0.9rem}
  input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); font-size:1rem;
  }
  input:focus{outline:2px solid var(--accent2)}
  button{
    padding:12px 18px; border-radius:10px; border:none; background:var(--accent);
    color:#fff; font-size:1rem; font-weight:600; cursor:pointer;
  }
  button:hover{background:var(--accent2)}

  #chat{flex:1; display:none; flex-direction:column; min-height:0}
  #messages{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px}
  .msg-row{display:flex; flex-direction:column; max-width:78%}
  .msg-row.me{align-self:flex-end; align-items:flex-end}
  .msg-row.them{align-self:flex-start; align-items:flex-start}
  .msg{padding:9px 13px; border-radius:14px; font-size:0.94rem; line-height:1.4; white-space:pre-wrap; word-break:break-word}
  .msg-row.me .msg{background:var(--bubble-me); border-bottom-right-radius:4px}
  .msg-row.them .msg{background:var(--bubble-them); border-bottom-left-radius:4px}
  .msg-time{font-size:0.72rem; color:var(--muted); margin-top:3px; padding:0 4px}
  .empty{color:var(--muted); text-align:center; font-size:0.9rem; padding:24px}

  #composer{
    display:flex; gap:8px; padding:12px; border-top:1px solid var(--line);
    padding-bottom:max(12px, env(safe-area-inset-bottom, 0px));
  }
  #composer input{flex:1}
  #composer button{flex-shrink:0}
</style>
</head>
<body>

<header>
  <span class="mark">K</span>
  <div>
    <h1>KiaanChat</h1>
    <p>Chat directly with Kiaan</p>
  </div>
</header>

<div id="gate">
  <div class="gate-card">
    <h2>What's your name?</h2>
    <p>So Kiaan knows who's messaging. Then say what kind of website you're after.</p>
    <input id="nameInput" type="text" placeholder="Your name" maxlength="40">
    <p id="nameErr" style="color:#ef4444;font-size:0.85rem;min-height:1.1em;margin:0"></p>
    <button id="startBtn" type="button">Start chat</button>
  </div>
</div>

<div id="chat">
  <div id="messages"></div>
  <form id="composer">
    <input id="textInput" type="text" placeholder="Type a message…" maxlength="2000" autocomplete="off">
    <button type="submit">Send</button>
  </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  (function(){
    var socket = io();
    var messagesEl = document.getElementById('messages');
    var gateEl = document.getElementById('gate');
    var chatEl = document.getElementById('chat');
    var nameInput = document.getElementById('nameInput');
    var nameErr = document.getElementById('nameErr');
    var startBtn = document.getElementById('startBtn');

    /* Same junk check The Nut Project's review form uses, so "asdfgh"
       doesn't get through as a name. */
    function looksFake(raw){
      var t = String(raw || '').trim();
      if (!t) return true;
      if (/[^\u0000-ʯ]/.test(t)) return t.length < 2;
      var letters = t.replace(/[^a-z]/gi, '');
      if (letters.length < 2) return true;
      if (letters.length > 2){
        var v = (letters.match(/[aeiouy]/gi) || []).length;
        var r = v / letters.length;
        if (r < 0.15) return true;
        if (letters.length >= 5 && r > 0.9) return true;
        if (/[bcdfghjklmnpqrstvwxz]{5,}/i.test(letters)) return true;
      }
      if (/(.)\1{3,}/i.test(t)) return true;
      if (/(qwer|wert|erty|asdf|sdfg|dfgh|zxcv|xcvb|hjkl|1234|abcd)/i.test(t)) return true;
      return false;
    }
    var composer = document.getElementById('composer');
    var textInput = document.getElementById('textInput');

    function getVisitorId(){
      try {
        var id = localStorage.getItem('kc_visitor_id');
        if (!id) {
          id = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
          localStorage.setItem('kc_visitor_id', id);
        }
        return id;
      } catch(e) {
        return 'v_' + Date.now().toString(36);
      }
    }

    function formatTime(ts){
      var d = new Date(ts);
      var sameDay = d.toDateString() === new Date().toDateString();
      var time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      if (sameDay) return time;
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + time;
    }

    function renderMessage(msg){
      var row = document.createElement('div');
      row.className = 'msg-row ' + (msg.from === 'visitor' ? 'me' : 'them');
      var bubble = document.createElement('div');
      bubble.className = 'msg';
      bubble.textContent = msg.text;
      var time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = formatTime(msg.at);
      row.appendChild(bubble);
      row.appendChild(time);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function startChat(name){
      try { localStorage.setItem('kc_visitor_name', name); } catch(e) {}
      gateEl.style.display = 'none';
      chatEl.style.display = 'flex';
      socket.emit('visitor:init', { visitorId: getVisitorId(), name: name });
    }

    socket.on('visitor:history', function(history){
      messagesEl.innerHTML = '';
      if (!history.length){
        var empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = "Say hi — Kiaan will reply as soon as he can.";
        messagesEl.appendChild(empty);
      } else {
        history.forEach(renderMessage);
      }
    });

    socket.on('chat:message', function(msg){
      var empty = messagesEl.querySelector('.empty');
      if (empty) empty.remove();
      renderMessage(msg);
    });

    startBtn.addEventListener('click', function(){
      var name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }
      if (looksFake(name)){
        nameErr.textContent = "That doesn't look like a real name — try again?";
        nameInput.focus();
        return;
      }
      nameErr.textContent = '';
      startChat(name);
    });
    nameInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter') startBtn.click();
    });

    composer.addEventListener('submit', function(e){
      e.preventDefault();
      var text = textInput.value.trim();
      if (!text) return;
      socket.emit('visitor:send', { text: text });
      textInput.value = '';
    });

    try {
      var savedName = localStorage.getItem('kc_visitor_name');
      if (savedName) startChat(savedName);
    } catch(e) {}
  })();
</script>
</body>
</html>
